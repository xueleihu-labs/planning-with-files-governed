[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planning-with-files-governed"
version = "2.0.0rc4"
description = "Governance-oriented, file-based planning and checkpoint system for AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "xueleihu52-arch"},
]
keywords = ["planning", "checkpoint", "governance", "ai-agent", "file-based"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
pwf = "pwf_governed.cli:main"

[project.urls]
Homepage = "https://github.com/xueleihu-labs/planning-with-files-governed"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pwf_governed*"]

[tool.setuptools.package-data]
pwf_governed = [
    "resources/schemas/*.json",
    "resources/templates/*.md",
    "resources/templates/**/*.md",
    "resources/templates/**/*.json",
    "resources/config/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

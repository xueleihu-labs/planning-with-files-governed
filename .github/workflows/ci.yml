# CI for planning-with-files-governed Community Edition
# Note: This CI runs when the repository is pushed to GitHub. It does not run locally.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No external dependencies required - standard library only
          pip install pytest
        shell: bash

      - name: Compile check (py_compile)
        run: |
          python -m py_compile scripts/*.py
        shell: bash

      - name: Run pytest
        run: |
          python -m pytest tests/ -q --tb=short
        shell: bash

      - name: Schema validation
        run: |
          python scripts/validate-schemas.py
        shell: bash

      - name: Privacy scan
        run: |
          python scripts/privacy-scan.py
        shell: bash

      - name: Plan doctor on examples
        run: |
          python scripts/plan-doctor.py doctor --planning-dir examples/basic --task-id example-task
        shell: bash

  # Quick job to summarize results
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "Test matrix result: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "One or more test matrix entries failed."
            exit 1
          fi
          echo "All test matrix entries passed."
